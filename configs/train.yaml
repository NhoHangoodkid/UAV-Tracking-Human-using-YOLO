# configs/train.yaml
# Hyperparameters for YOLO model training.
# Upload this file to Colab together with the zipped dataset.
# YOLO handles the entire training loop; this file is the only knob to turn.


# BASE CONFIG

model: yolov8n.pt               # Pre-trained weights to fine-tune from.
                                # yolov8n.pt  -> Nano  (fastest, least accurate, good for prototyping).
                                # yolov8s.pt  -> Small (better accuracy, still runs on RTX 4050).
                                # yolov8m.pt  -> Medium (heavier, needs more VRAM).

data: configs/dataset.yaml      # Path to the dataset config above.
                                # Must be relative to the working directory when training.



# TRAINING PARAMETERS


epochs:   50                    # Total training rounds over the full dataset.
patience: 10                    # Early stopping: halt if no mAP improvement after 10 consecutive epochs.
batch:    16                    # Images per gradient update step.
                                # RTX 4050 (6 GB VRAM): batch 16 is safe. Try 32 if VRAM allows.
imgsz:    640                   # All input frames are resized to 640×640 before entering the network.
device:   0                     # 0 _ use GPU (CUDA). Set to 'cpu' if no GPU is available.
workers:  4                     # CPU threads for the data loader. Increase to 8 if I/O is the bottleneck.


# OUTPUT

project:   runs/train           # Root directory where all training runs are saved.
name:      human_tracking_v1    # Sub-directory name for this specific experiment.
                                # Results, weights, and plots go to runs/train/human_tracking_v1/.
exist_ok:  false                # false-> create a new numbered folder if name already exists.
                                # true -> overwrite the existing folder (use with caution).



# AUGMENTATION
# Augmentation is critical for UAV footage:
#   - People appear very small (sometimes < 10px tall).
#   - Camera angle and altitude vary between shots.
#   - Lighting changes drastically between day/night/shadows.

mosaic:      1.0                # Always combine 4 images into one tile.
                                # Forces the model to detect many small objects per frame —
                                # exactly the condition in UAV footage.

scale:       0.5                # Random zoom in/out by ±50%.
                                # Teaches the model to recognize people at varying altitudes.

translate:   0.1                # Randomly shift the image by ±10% horizontally and vertically.
                                # Prevents the model from relying on object position in the frame.

degrees:     5.0                # Rotate the image by up to ±5 degrees.
                                # UAV cameras tilt slightly during flight; this mimics that effect.

perspective: 0.0005             # Apply a mild perspective warp.
                                # Simulates the slight lens distortion from a drone's wide-angle camera.

fliplr:      0.5                # Horizontal flip with 50% probability.
                                # People look the same from either side; this doubles effective dataset size.

hsv_h:       0.015              # Hue shift ±1.5%. Handles color casts from different sky conditions.
hsv_s:       0.7                # Saturation shift ±70%. Covers overcast vs. bright sunlight variation.
hsv_v:       0.4                # Brightness shift ±40%. Critical for dawn, dusk, and shadowed areas.