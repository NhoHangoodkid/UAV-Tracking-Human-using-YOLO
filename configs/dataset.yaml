# configs/dataset.yaml
# Dataset configuration for YOLOv8 training.
# This file tells YOLO where to find the data and how many classes to expect.
# It is the single source of truth for class definitions —
# when adding a new class (e.g., Vehicle), this is the only file that needs to be updated.

# PATHS
# Root path to the dataset directory.
# All sub-paths below are resolved relative to this.
# Training on Google Colab, change this to /content/data/dataset

path: ../data/dataset

train: images/train       # Relative path to training images
val:   images/val         # Relative path to validation images
test:  images/test        # Relative path to test images


# CLASSES
# nc    : total number of classes
# names : class name list, where index = class ID
#         Must match TARGET_CLASS_LABEL in class_mapper.py

nc: 1
names: ["human"]          # ID 0 -> human
                          # To add Vehicle: nc: 2, names: ["human", "vehicle"]