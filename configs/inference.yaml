# configs/inference.yaml
# Runtime configuration for the inference pipeline.
# All parameters here are read by run_inference.py at startup.
# Values can be overridden from the command line; this file serves as the default.

# FILE PATHS

model_weights: weights/v1_human_only/best.pt    # Path to the trained model weights.
                                                # Switch to v2_vehicle_added/best.pt when
                                                # the second model version is ready.

source_video:  ""                               # Path to the input video file.
                                                # Leave empty here - pass via --source flag when running:
                                                #   python run_inference.py --source path/to/video.mp4
                                                # Fill in a path here only for quick debug runs.

output_dir:    output/                          # Directory where annotated output videos are saved.
                                                # Files are named: {original_stem}_{timestamp}.mp4
                                                # so repeated runs never overwrite each other.


# YOLO DETECTION PARAMETERS

conf_thresh: 0.4                # Discard any detection below this confidence score.
                                # Start at 0.4 for UAV footage; tune upward (0.45–0.5) if
                                # you see too many false positives (shadows, vehicles, trees).
                                # Tune downward if people are being missed at long range.

iou_thresh:  0.45               # IoU threshold for Non-Maximum Suppression (NMS).
                                # Boxes that overlap more than 45% are merged into one.
                                # Lower -> fewer duplicate boxes. Higher -> more boxes kept.

imgsz:       640                # Each video frame is resized to this resolution before inference.
                                # Must match the imgsz used during training.

device:      0                  # 0 -> GPU (CUDA). Set to 'cpu' if no GPU is available.


# TRACKING

tracker_config: configs/tracker.yaml   # Path to the tracker parameter file.
                                       # Swap tracker type inside that file without touching this one.


# VISUALIZATION

show_labels:      true          # Render the class label ("human") above each bounding box.
show_conf:        true          # Render the confidence score (e.g., "0.87") next to the label.
save_trajectory:  true          # Draw the movement trail for each tracked ID.
                                # Useful for analyzing crowd flow patterns from UAV footage.
                                # Set to false to reduce rendering cost on long videos.